<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="sparkleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="50" cy="50" r="45" fill="url(#sparkleAura)"/>
  <g filter="url(#starGlow)">
    <!-- 5-Point Star -->
    <polygon points="50,10 62,35 88,38 69,56 74,83 50,70 26,83 31,56 12,38 38,35" 
             fill="url(#starGrad)" stroke="#b45309" stroke-width="2"/>
    <!-- Cute Eyes / Face for game flair -->
    <ellipse cx="43" cy="48" rx="2.5" ry="4" fill="#78350f"/>
    <ellipse cx="57" cy="48" rx="2.5" ry="4" fill="#78350f"/>
    <circle cx="44" cy="46" r="1" fill="#ffffff"/>
    <circle cx="58" cy="46" r="1" fill="#ffffff"/>
    <!-- Cute smile -->
    <path d="M46,55 Q50,59 54,55" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="38" cy="53" rx="2" ry="1.2" fill="#f87171" opacity="0.6"/>
    <ellipse cx="62" cy="53" rx="2" ry="1.2" fill="#f87171" opacity="0.6"/>
  </g>
</svg>
