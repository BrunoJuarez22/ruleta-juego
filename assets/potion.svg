<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="liquidGrad" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="potionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#potionGlow)">
    <!-- Cork -->
    <rect x="42" y="12" width="16" height="10" rx="2" fill="#b45309" stroke="#78350f" stroke-width="1"/>
    <!-- Bottle Neck Rim -->
    <ellipse cx="50" cy="22" rx="12" ry="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Liquid inside -->
    <path d="M38,42 Q30,55 30,68 A20,20 0 0,0 70,68 Q70,55 62,42 Z" fill="url(#liquidGrad)"/>
    <!-- Bubbles -->
    <circle cx="45" cy="65" r="3" fill="#fda4af" opacity="0.8"/>
    <circle cx="55" cy="72" r="2" fill="#fda4af" opacity="0.9"/>
    <circle cx="50" cy="54" r="2.5" fill="#fda4af" opacity="0.7"/>
    <circle cx="40" cy="74" r="1.5" fill="#fda4af" opacity="0.6"/>
    <!-- Bottle Flask Glass -->
    <path d="M42,22 L42,35 C30,48 24,58 24,70 A26,26 0 0,0 76,70 C76,58 70,48 58,35 L58,22 Z" 
          fill="url(#glassGrad)" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Glass Highlights -->
    <path d="M30,68 A20,20 0 0,1 42,48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>
</svg>
