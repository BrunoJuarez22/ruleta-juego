<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="gemGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0891b2" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main diamond shape -->
    <polygon points="50,12 85,38 50,90 15,38" fill="url(#gemGlow)" stroke="#a5f3fc" stroke-width="2"/>
    <!-- Top facets -->
    <polygon points="50,12 85,38 65,38 50,22" fill="#cffafe" fill-opacity="0.8"/>
    <polygon points="50,12 15,38 35,38 50,22" fill="#a5f3fc" fill-opacity="0.9"/>
    <polygon points="50,22 65,38 35,38" fill="#ecfeff" fill-opacity="0.95"/>
    <!-- Bottom facets -->
    <polygon points="50,90 85,38 65,38" fill="#0891b2" fill-opacity="0.7"/>
    <polygon points="50,90 15,38 35,38" fill="#0e7490" fill-opacity="0.9"/>
    <polygon points="50,90 35,38 65,38" fill="#22d3ee" fill-opacity="0.6"/>
    <!-- Sparkle -->
    <polygon points="35,30 38,38 46,41 38,44 35,52 32,44 24,41 32,38" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
