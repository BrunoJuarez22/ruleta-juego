<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shieldGlow)">
    <!-- Outer Shield -->
    <path d="M50,12 C75,12 85,25 85,48 C85,72 65,85 50,92 C35,85 15,72 15,48 C15,25 25,12 50,12 Z" 
          fill="url(#shieldBorder)"/>
    <!-- Inner Shield -->
    <path d="M50,17 C71,17 79,28 79,48 C79,68 62,79 50,86 C38,79 21,68 21,48 C21,28 29,17 50,17 Z" 
          fill="url(#shieldGrad)"/>
    <!-- Crest / Star in center -->
    <polygon points="50,30 55,42 67,42 57,50 61,62 50,54 39,62 43,50 33,42 45,42" fill="#facc15" stroke="#fef08a" stroke-width="1"/>
    <!-- Highlights -->
    <path d="M50,20 C68,20 74,30 74,48 C74,52 72,60 70,65 C68,40 58,25 50,20 Z" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>
