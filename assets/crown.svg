<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="rubyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="sapphireGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ca8a04" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#crownGlow)">
    <!-- Base Velvet Cap Behind -->
    <path d="M22,70 Q50,45 78,70 Z" fill="#991b1b" opacity="0.9"/>
    <!-- Crown Spikes -->
    <path d="M15,70 L20,38 L36,54 L50,22 L64,54 L80,38 L85,70 Z" 
          fill="url(#crownGrad)" stroke="#854d0e" stroke-width="1.5"/>
    <!-- Jewels on Peaks -->
    <circle cx="20" cy="38" r="4.5" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="50" cy="22" r="6" fill="url(#sapphireGrad)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="80" cy="38" r="4.5" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="1"/>
    <!-- Crown Rim Band -->
    <rect x="14" y="68" width="72" height="12" rx="3" fill="url(#crownGrad)" stroke="#854d0e" stroke-width="1.5"/>
    <!-- Gems on Band -->
    <circle cx="26" cy="74" r="3.5" fill="url(#emeraldGrad)"/>
    <circle cx="42" cy="74" r="3.5" fill="url(#rubyGrad)"/>
    <circle cx="58" cy="74" r="3.5" fill="url(#sapphireGrad)"/>
    <circle cx="74" cy="74" r="3.5" fill="url(#emeraldGrad)"/>
  </g>
</svg>
