<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="goldHilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="swordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#swordGlow)" transform="rotate(45 50 50)">
    <!-- Blade Aura / Flame -->
    <path d="M48,10 Q50,4 52,10 L56,58 L44,58 Z" fill="url(#fireGrad)" opacity="0.8"/>
    <!-- Blade -->
    <polygon points="50,14 55,56 45,56" fill="url(#bladeGrad)" stroke="#60a5fa" stroke-width="0.8"/>
    <line x1="50" y1="14" x2="50" y2="56" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Guard -->
    <rect x="36" y="56" width="28" height="6" rx="3" fill="url(#goldHilt)" stroke="#713f12" stroke-width="1"/>
    <circle cx="50" cy="59" r="2.5" fill="#ef4444"/>
    <!-- Grip -->
    <rect x="47" y="62" width="6" height="18" rx="2" fill="#78350f" stroke="#451a03" stroke-width="0.8"/>
    <!-- Pommel -->
    <circle cx="50" cy="83" r="5" fill="url(#goldHilt)" stroke="#713f12" stroke-width="1"/>
    <circle cx="50" cy="83" r="2" fill="#3b82f6"/>
  </g>
</svg>
