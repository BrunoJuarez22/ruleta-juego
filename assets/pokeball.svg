<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f87171"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="35%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#ballShadow)">
    <!-- Bottom White Hemisphere -->
    <path d="M50,10 A40,40 0 0,0 50,90 A40,40 0 0,0 50,10 Z" fill="url(#bottomGlow)"/>
    <!-- Top Red Hemisphere -->
    <path d="M10,50 A40,40 0 0,1 90,50 Z" fill="url(#ballGlow)"/>
    <!-- Center Black Dividing Band -->
    <rect x="10" y="47" width="80" height="6" fill="#1e293b"/>
    <!-- Outer Center Ring -->
    <circle cx="50" cy="50" r="14" fill="#1e293b"/>
    <circle cx="50" cy="50" r="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Inner Center Button -->
    <circle cx="50" cy="50" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  </g>
</svg>
