<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="innerCoinGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ca8a04" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#coinGlow)">
    <!-- Base Coin -->
    <circle cx="50" cy="50" r="38" fill="url(#coinGrad)" stroke="#854d0e" stroke-width="2"/>
    <!-- Outer Ridge Ribbing -->
    <circle cx="50" cy="50" r="33" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Inner Coin Disk -->
    <circle cx="50" cy="50" r="30" fill="url(#innerCoinGrad)" stroke="#a16207" stroke-width="1.5"/>
    <!-- Star Emblem -->
    <polygon points="50,28 55,42 70,42 58,51 62,65 50,56 38,65 42,51 30,42 45,42" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
    <!-- Shine highlight -->
    <path d="M26,38 C32,26 48,20 62,24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
