# fly.toml — Configuración de despliegue para Shiny Roulette en Fly.io
# Documentación: https://fly.io/docs/reference/configuration/

app = 'shiny-roulette'
primary_region = 'qro'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Disco persistente para SQLite (nunca se borra al reiniciar ni al entrar en reposo)
[mounts]
  source = 'roulette_data'
  destination = '/app/data'
  initial_size = '1gb'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
